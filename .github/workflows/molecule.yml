# Lint CI for the role.
#
# The lint job runs through the org's shared reusable workflow in
# netresearch/.github, so the pinned action versions (checkout,
# setup-python) are maintained centrally instead of per-repo.
name: Molecule

on: push

permissions: {}

jobs:
  # TODO: Find a way to run against a Gitlab instance for testing.
  # When enabled, route it through the shared reusable:
  #   molecule:
  #     name: Run molecule against role
  #     uses: netresearch/.github/.github/workflows/ansible-molecule.yml@main
  #     permissions:
  #       contents: read
  #     with:
  #       # TODO: Remove `requests` pin https://github.com/ansible-community/molecule-plugins/issues/256
  #       pip-packages: "ansible molecule molecule-docker requests<2.32.0"

  lint:
    name: Lint role
    uses: netresearch/.github/.github/workflows/ansible-lint.yml@main
    permissions:
      contents: read
    with:
      pip-packages: "ansible ansible-lint yamllint"
